<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patient Education 3D</title>
<style>
  :root { --ink: #eaf6f8; --muted: #9fbcc4; --accent: #4cc3d6; --glass: rgba(10, 30, 38, .55); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: radial-gradient(ellipse at 50% 35%, #1f4a57 0%, #0f2831 55%, #081820 100%);
         color: var(--ink); font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
  button { font: inherit; cursor: pointer; }
  canvas#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #fade { position: fixed; inset: 0; background: #081820; opacity: 0; pointer-events: none; }

  #menu { position: fixed; inset: 0; overflow: auto; padding: 40px 16px; background: rgba(6, 20, 26, .72); backdrop-filter: blur(6px); }
  #menu .inner { max-width: 1100px; margin: 0 auto; }
  #menu h1 { font-size: clamp(28px, 4vw, 44px); margin: 0 0 6px; }
  #menu p { color: var(--muted); margin: 0 0 28px; font-size: 19px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
  .card { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); border-radius: 18px; padding: 22px;
          text-align: left; color: var(--ink); transition: border-color .2s, transform .2s, background .2s; }
  .card:hover:not(:disabled) { border-color: var(--accent); background: rgba(76,195,214,.12); transform: translateY(-2px); }
  .card b { display: block; font-size: 21px; margin-bottom: 6px; }
  .card span { color: var(--muted); font-size: 15px; }
  .card:disabled { opacity: .45; cursor: default; }
  .credit { margin-top: 26px; font-size: 12px; color: var(--muted); opacity: .7; }
  .credit a { color: inherit; }

  .topbar { position: fixed; top: 0; left: 0; right: 0; display: none; align-items: center; gap: 10px; padding: 14px 16px; }
  .playing .topbar { display: flex; }
  .topbar h2 { margin: 0; font-size: clamp(20px, 3vw, 30px); flex: 1; text-shadow: 0 2px 12px rgba(0,0,0,.5); }
  .btn { background: var(--glass); border: 1px solid rgba(255,255,255,.14); border-radius: 12px; padding: 10px 16px; color: var(--ink); backdrop-filter: blur(8px); }
  .btn.primary { background: var(--accent); color: #062028; border-color: transparent; font-weight: 600; }

  .caption { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); width: min(1100px, calc(100% - 32px));
             display: none; background: var(--glass); border: 1px solid rgba(255,255,255,.12); border-radius: 20px;
             padding: 16px 22px 14px; text-align: center; backdrop-filter: blur(10px); }
  .playing .caption { display: block; }
  .caption .step { color: var(--accent); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: clamp(13px, 1.6vw, 17px); }
  .caption .text { font-size: clamp(20px, 2.8vw, 34px); line-height: 1.3; margin-top: 6px; transition: opacity .4s; min-height: 2.6em; }
  .progress { display: flex; gap: 6px; margin-top: 12px; }
  .progress div { flex: 1; height: 5px; border-radius: 3px; background: rgba(255,255,255,.15); overflow: hidden; }
  .progress i { display: block; height: 100%; width: 0; background: var(--accent); }

  #status { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 20px; color: var(--muted); pointer-events: none; }
</style>
<script type="importmap">

<canvas id="gl"></canvas>
<div id="fade"></div>
<div id="status">Loading 3D…</div>

  <div class="inner">
    <h1>Understanding your treatment</h1>
    <p>Tap a topic to watch a short explanation. Your doctor will answer any questions.</p>
    <div class="grid" id="grid"></div>
    <div class="credit">Tooth models: University of Dundee, School of Dentistry — <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a></div>

</section>

<div class="topbar">
  <button class="btn" id="back">← Topics</button>
  <h2 id="ptitle"></h2>

  <button class="btn primary" id="play">Pause</button>
  <button class="btn" id="next">▶</button>
</div>
<div class="caption">
  <div class="step" id="pstep"></div>
  <div class="text" id="ptext"></div>
  <div class="progress" id="progress"></div>

// ---------------------------------------------------------------- renderer
const renderer = new THREE.WebGLRenderer({ canvas: $('gl'), antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.localClippingEnabled = true;

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.7;

const camera = new THREE.PerspectiveCamera(34, 1, 0.1, 200);
camera.position.set(5.5, 3.5, 7.5);

scene.add(new THREE.HemisphereLight(0xdff4ff, 0x3a2a2a, 0.5));
const key = new THREE.DirectionalLight(0xfff4e8, 2.6);
key.position.set(3, 7, 5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -5, right: 5, top: 5, bottom: -5, near: 1, far: 20 });
key.shadow.bias = -0.0005;
key.shadow.radius = 4;
scene.add(key);
const rim = new THREE.DirectionalLight(0x9fe3ff, 1.6);
rim.position.set(-5, 3, -5);
scene.add(rim);

const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const lerp = (a, b, t) => a + (b - a) * t;
const keyframes = (k, p) => {
  for (let i = 1; i < k.length; i++) if (p <= k[i][0]) return lerp(k[i - 1][1], k[i][1], smooth(k[i - 1][0], k[i][0], p));
  return k[k.length - 1][1];
};

  const zz = z + 0.1, halfW = 0.26 + 0.05 * Math.sin(x * 7);               // along the central groove, a little towards the tongue

  const fill = smooth(0, 0.03, halfW - Math.abs(zz)) * smooth(0, 0.03, 0.66 - x) * smooth(0, 0.03, x + 0.62) * band;

  const positions = [];

  const sample = (posAttr, nrmAttr, index, ox, count) => {
    for (let k = 0; k < count; k++) {
      const t = Math.floor(rand() * index.count / 3) * 3;
      const i0 = index.getX(t), i1 = index.getX(t + 1), i2 = index.getX(t + 2);

  attach:  { loc: 'align', pos: [1.3, 1.5, 5.2], look: [0.1, 0.3, 1.4] },
  wear:    { loc: 'align', pos: [0.6, 2.6, 9.8], look: [-0.6, 0.9, 0.5] },
  aligned: { loc: 'align', pos: [0, 2.4, 7.6], look: [0, 0.2, 0.8] },
  retain:  { loc: 'align', pos: [0.8, 2.7, 8.2], look: [0, 0.3, 0.7] },
  nl_problem: { loc: 'nlsec', pos: [-0.3, 0.1, 29.5], look: [-1.35, -0.34, 0] },   // opens wide; moved in during the scene
  nl_how:     { loc: 'nlhow', pos: [1.0, 1.5, 9.6], look: [0, -0.35, 0] },   // the whole block sits above the caption
  nl_areas:   { loc: 'nlsec', pos: [0.9, -0.9, 12.2], look: [0.0, -1.25, 0] },
  nl_plan:    { loc: 'nlplan', pos: [0, 0, 11.2], look: [0, 0, 0] },
  nl_result:  { loc: 'nlsec', pos: [1.0, -0.9, 12.6], look: [-0.1, -1.3, 0] },
  maintain: { loc: 'perio', pos: [11.5, 0.6, -3.0], look: [0, -1.8, -0.3] },
};
const IDLE = { loc: 'mouth', pos: [5.5, 3.5, 7.5], look: [0, -0.2, 0] };
const camLook = new THREE.Vector3(0, 0, 0), camTarget = new THREE.Vector3(), lookTarget = new THREE.Vector3();
let curLoc = 'mouth', fade = 0, shownShot = IDLE;

// ---------------------------------------------------------------- player
let topic = null, idx = 0, playing = true, elapsed = 0, lastIdx = -1;
let brSide = -1;   // which abutment the bridge bur is over; switches while it is off screen
const pres = { drill: 0, scanner: 0, implScan: 0, crown: 0, spark: 0, arm: 0, probe: 0, scaler: 0, curette: 0, archScan: 0, brDrill: 0, brScan: 0, laser: 0 };

const grid = $('grid');
TOPICS.forEach(t => {
  const b = document.createElement('button');
  b.className = 'card'; b.disabled = !t.scenes;
  b.innerHTML = `<b>${t.title}</b><span>${t.scenes ? t.blurb : 'Coming soon'}</span>`;
  b.onclick = () => openTopic(t);
  grid.appendChild(b);
});

function openTopic(t) {
  topic = t; playing = true; $('play').textContent = 'Pause';
  $('menu').style.display = 'none';
  document.body.classList.add('playing');
  $('ptitle').textContent = t.title;
  $('progress').innerHTML = t.scenes.map(() => '<div><i></i></div>').join('');
  go(0);
}
function go(i) {
  const n = topic.scenes.length;
  idx = (i + n) % n; elapsed = 0;
  const s = topic.scenes[idx], txt = $('ptext');
  txt.style.opacity = 0;
  setTimeout(() => { $('pstep').textContent = s.label; txt.textContent = s.text; txt.style.opacity = 1; }, 250);
  [...$('progress').children].forEach((d, j) => d.firstChild.style.width = j < idx ? '100%' : '0');
}
$('play').onclick = () => { playing = !playing; $('play').textContent = playing ? 'Pause' : 'Play'; };
$('next').onclick = () => go(idx + 1);
$('prev').onclick = () => go(idx - 1);
$('back').onclick = () => { topic = null; document.body.classList.remove('playing'); $('menu').style.display = ''; };
document.addEventListener('keydown', e => {
  if (!topic) return;
  if (e.key === 'ArrowRight') go(idx + 1);
  if (e.key === 'ArrowLeft') go(idx - 1);
  if (e.key === ' ') { e.preventDefault(); $('play').click(); }
});

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.fov = w / h < 1 ? 50 : 34;   // portrait tablets need a wider view
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

// ---------------------------------------------------------------- frame
const ORDER = TOPICS[0].scenes.map(s => s.id);
const clock = new THREE.Clock();
const tipPos = new THREE.Vector3(), away = new THREE.Vector3(), wtmp = new THREE.Vector3();
const JAW = [[0, 4.6], [0.12, 1.8], [0.19, 2.5], [0.29, 1.8], [0.35, 2.5], [0.44, 1.76], [0.52, 1.76], [0.66, 3.2], [0.8, 4.6], [1, 4.6]];
const CRACK = [[0, 0.35], [0.12, 0.35], [0.14, 0.55], [0.29, 0.55], [0.31, 0.8], [0.43, 0.9], [0.44, 1]];
const BREAK_P = 0.44;

renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05), time = clock.elapsedTime;

  if (topic && playing) {
    elapsed += dt;
    const sc = topic.scenes[idx];
    $('progress').children[idx].firstChild.style.width = Math.min(100, elapsed / sc.secs * 100) + '%';
    if (elapsed >= sc.secs) go(idx + 1);
  }
  const id = topic ? topic.scenes[idx].id : 'idle';
  const secs = topic ? topic.scenes[idx].secs : 1;
  const p = topic ? Math.min(1, elapsed / secs) : 0;
  const at = name => ORDER.indexOf(name);
  const si = ORDER.indexOf(id);   // -1 when idle
  const after = name => si > at(name);
  if (idx !== lastIdx) { lastIdx = idx; if (id === 'scan') scanPts.userData.captured.fill(0); }

  // ---- tooth state
  const prep = id === 'shape' ? smooth(0.15, 0.85, p) : after('shape') ? 1 : 0;
  const broken = id === 'bite' ? (p >= BREAK_P ? 1 : 0) : (after('bite') && si >= 0 ? 1 : 0);
  const crack = id === 'bite' ? keyframes(CRACK, p) : after('bite') && si >= 0 ? 1 : 0.35;
  const frac = broken * (1 - prep);
  tooth.morphTargetInfluences[0] = prep;
  tooth.morphTargetInfluences[1] = frac;
  paintTooth(crack * (1 - broken), frac, prep);

  // ---- bite + fracture
  upperJaw.position.y = id === 'bite' ? keyframes(JAW, p) : 8;
  upperJaw.visible = id === 'bite';
  const tb = id === 'bite' ? (p - BREAK_P) * secs : -1;
  fragment.visible = tb >= 0 && tb < 1.6;
  if (fragment.visible) {
    const h = fragment.userData.home;
    fragment.position.set(h.x + 0.7 * tb, h.y + 1.2 * tb - 4.5 * tb * tb, h.z + 2.6 * tb);
    fragment.rotation.set(tb * 5, tb * 2, tb * 3);
  }
  impact.position.copy(fragment.userData.home);
  impact.material.opacity = tb >= 0 ? Math.exp(-tb * 5) : 0;
  impact.scale.setScalar(0.4 + tb * 1.5);
  const shake = tb >= 0 ? 0.07 * Math.exp(-tb * 7) : 0;

  const approach = (k, on) => { pres[k] += ((on ? 1 : 0) - pres[k]) * Math.min(1, dt * 2.5); return pres[k]; };
  const ease = x => x * x * (3 - 2 * x);

  // ---- drill
  const dr = ease(approach('drill', id === 'shape' && p < 0.92));
  tipPos.set(0.45 * Math.cos(time * 1.7), lerp(0.98, 0.62, prep) + 0.02, 0.38 * Math.sin(time * 1.7));
  drill.position.set(tipPos.x, tipPos.y + lerp(5, 0, dr), tipPos.z);
  drill.visible = dr > 0.01;
  bur.rotation.y += dt * 60;
  if (id === 'shape' && p > 0.15 && p < 0.85 && dr > 0.9) emitDust(tipPos, 4);

  // ---- scanner + projected points
  const scn = ease(approach('scanner', id === 'scan' && p < 0.93));
  const sweepU = smooth(0.1, 0.95, p);                       // sweep follows the scene, not the clock
  const sx = 2.4 * Math.sin(sweepU * Math.PI * 2 - Math.PI / 2);
  scanner.position.set(sx, 1.95 + lerp(5, 0, scn), 0);
  scanner.visible = scn > 0.01;
  {
    const posA = scanPts.geometry.attributes.position, alphaA = scanPts.geometry.attributes.alpha, glowA = scanPts.geometry.attributes.glow, cap = scanPts.userData.captured;
    const active = id === 'scan' && scn > 0.6 && p > 0.1;
    scanPts.material.uniforms.scale.value = renderer.domElement.height / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)));
    for (let i = 0; i < cap.length; i++) {
      const inBand = active && Math.abs(posA.getX(i) - sx) < 0.14;
      if (inBand) cap[i] = 1;
      const flicker = 0.7 + 0.3 * Math.sin(i * 12.9898 + time * 20);
      alphaA.setX(i, inBand ? flicker : cap[i] * 0.65 * scn);
      glowA.setX(i, inBand ? 1 : 0);
    }
    alphaA.needsUpdate = glowA.needsUpdate = true;
    scanPts.visible = id === 'scan';
  }

  // ---- particles
  for (let i = 0; i < DUST; i++) {
    if (dustLife[i] <= 0) { dustPos[i * 3 + 1] = -99; continue; }
    dustLife[i] -= dt;
    dustVel[i * 3 + 1] -= 5 * dt;
    for (let a = 0; a < 3; a++) dustPos[i * 3 + a] += dustVel[i * 3 + a] * dt;
  }
  dustGeo.attributes.position.needsUpdate = true;

  // ---- design software
  if (curLoc === 'desk' && topic && topic.id === 'invisalign') {
    const ap = id === 'plan' ? p : 1;
    const stage = 1 + Math.round(smooth(0.1, 0.95, ap) * (ALIGNER_TOTAL - 1));
    drawAlignUI(ap < 0.15 ? 0 : ap < 0.75 ? 1 : ap < 0.95 ? 2 : 3, smooth(0.1, 0.95, ap), stage, ALIGNER_TOTAL);
    updateArch(cadA.arch, smooth(0.12, 0.92, ap));
    const ang = 0.35 + Math.sin(time * 0.3) * 0.5;
    cadA.cam.position.set(Math.sin(ang) * 7.5, 5.4, Math.cos(ang) * 7.5);
    cadA.cam.lookAt(0, -0.1, 0.6);
    const wantScreen = planTex || alignUiTex;
    if (desk.userData.screen.material.map !== wantScreen) {
      desk.userData.screen.material.map = wantScreen;
      desk.userData.view.material.map = cadA.rt.texture;
      desk.userData.view.visible = !planTex;        // a recording fills the whole monitor
    }
    renderer.setRenderTarget(cadA.rt);
    renderer.render(cadA.scene, cadA.cam);
    renderer.setRenderTarget(null);
  } else if (curLoc === 'desk') {
    if (desk.userData.screen.material.map !== uiTex) { desk.userData.screen.material.map = uiTex; desk.userData.view.material.map = cad.rt.texture; }
    const onImplant = !!topic && topic.id === 'implant';
    cad.stump.visible = cad.margin.visible = !onImplant;   // an implant has a post, and no margin line
    cad.post.visible = onImplant;
    cad.solid.geometry = onImplant ? implantCrownDesignGeo : finalCrownGeo;
    const dp = id === 'design' || id === 'im_design' ? p : after('design') ? 1 : 0;
    const step = dp < 0.2 ? 0 : dp < 0.45 ? 1 : dp < 0.9 ? 2 : 3;
    drawUI(step, smooth(0, 0.92, dp), onImplant);
    cad.margin.geometry.setDrawRange(0, Math.floor(128 * smooth(0.02, 0.2, dp)) * 8 * 6);
    const drop = smooth(0.2, 0.4, dp);
    cad.wire.position.y = cad.solid.position.y = lerp(1.6, 0, drop);
    cad.wire.material.opacity = drop > 0 ? 0.5 * (1 - smooth(0.55, 0.75, dp)) : 0;
    cad.solidMat.opacity = smooth(0.42, 0.62, dp);
    cad.solidMat.transparent = cad.solidMat.opacity < 0.999;
    cad.solid.scale.set(1.02, 1 + 0.05 * Math.sin(Math.PI * smooth(0.6, 0.8, dp)), 1.02);   // bite adjustment
    cad.contacts.forEach(c => c.material.opacity = smooth(0.68, 0.75, dp) * (0.6 + 0.4 * Math.sin(time * 5)));
    const a = 0.5 + Math.sin(time * 0.35) * 0.6;
    cad.cam.position.set(Math.sin(a) * 9.5, 5.2, Math.cos(a) * 9.5);
    cad.cam.lookAt(0, 0.1, 0);
    renderer.setRenderTarget(cad.rt);
    renderer.render(cad.scene, cad.cam);
    renderer.setRenderTarget(null);
  }

  // ---- milling
  {
    const milling = id === 'mill' || id === 'im_mill';
    mill.userData.crown.geometry = topic && topic.id === 'implant' ? implantCrownDesignGeo : finalCrownGeo;
    const mp = milling ? smooth(0.12, 0.88, p) : after('mill') ? 1 : 0;
    const cutting = milling && p > 0.12 && p < 0.88;
    const h = lerp(0.8, -0.26, mp);   // down to just under the block
    millPlane.constant = h;
    mill.userData.bar.scale.x = Math.max(0.001, mp);
    mill.userData.bar.position.x = -0.6 + 0.6 * mp;
    // arms ease in and out instead of jumping
    const arm = ease(approach('arm', cutting));
    const tx = 0.6 * Math.sin(time * 3.1), tz = 0.55 * Math.cos(time * 2.3);
    // top bur: follows the cutting height but rides over the crown (and keeps its motor clear of it)
    const wantY = Math.max(lerp(0.82, h, arm), millMaps.top('bur', tx, tz) + 0.01, millMaps.top('motor', tx, tz) - 0.44);
    topBurY = wantY > topBurY ? wantY : topBurY + (wantY - topBurY) * Math.min(1, dt * 8);
    const topY = topBurY;
    topSpindle.position.set(tx, topY, tz);
    const ram = mill.userData.ram;
    ram.position.set(tx, 1.6, tz);
    ram.scale.y = Math.max(0.01, 1.6 - (topY + 0.75));
    // side bur: touches the crown's side wall, or skims the freshly cut surface above it
    const sy = h + 0.04, sz = 0.45 * Math.sin(time * 2.7);
    const wall = millMaps.left(sy, sz);
    const wantX = wall < 5 ? wall - 0.01 : -0.3 + 0.1 * Math.sin(time * 4);
    sideBurX = wantX < sideBurX ? wantX : sideBurX + (wantX - sideBurX) * Math.min(1, dt * 10);
    sideSpindle.position.set(lerp(-1.0, sideBurX, arm), sy, sz);
    topSpindle.children[0].rotation.y += dt * 50;
    if (cutting && arm > 0.9 && curLoc === 'mill') {
      emitDust(wtmp.set(tx, topY, tz).add(MILL), 3, 3);
      emitDust(wtmp.copy(sideSpindle.position).add(MILL), 2, 3);
    }
  }

  // ---- final crown (placed same visit)
  // it comes down slowly, pauses just above the tooth, then seats gently
  const crDown = id === 'place' ? smooth(0.06, 0.5, p) : id === 'result' ? 1 : 0;
  const crSeat = id === 'place' ? smooth(0.56, 0.74, p) : id === 'result' ? 1 : 0;
  finalCrown.position.y = lerp(lerp(4, 0.4, 1 - (1 - crDown) ** 2), 0, crSeat);
  crownMat.opacity = smooth(0, 0.3, crDown); finalCrown.visible = crDown > 0.01;
  crownMat.transparent = crownMat.opacity < 0.999;
  crownMat.emissiveIntensity = id === 'place' ? 0.45 * Math.sin(Math.PI * smooth(0.76, 0.97, p)) : 0;   // bonding light once it is seated

  const sp = approach('spark', id === 'result' && p > 0.1);
  sparkles.forEach(o => {
    const tw = Math.max(0, Math.sin(time * 2.2 + o.userData.phase));
    o.material.opacity = sp * tw; o.scale.setScalar(0.12 + 0.22 * tw);
  });

  // ---- deep cleaning
  const cleanStep = topic && topic.id === 'cleaning' ? ['scaling', 'planing', 'healing', 'maintain'].indexOf(id) : -1;
  if (cleanStep >= 0) {
    const S = cleanStep;   // the treatment half; the disease itself is told by the problem scenes below
    const P = [P_ADVANCED, P_ADVANCED, lerpP(P_ADVANCED, P_TREATED, smooth(0.1, 0.75, p)), P_TREATED][S];
    rebuildPerio(P);
    const inflam = [1, 1, 1 - smooth(0.1, 0.75, p), 0][S];
    perioGumMat.color.setHex(0xe48a98).lerp(tmp.setHex(0xc2303e), inflam);

    // deposits: everything the disease left behind, cleared off as the tools pass
    const scaleU = S === 0 ? smooth(0.08, 0.92, p) : 0, planeU = S === 1 ? smooth(0.08, 0.92, p) : 0;
    deposits.forEach((d, i) => {
      let amt = 0;
      if (d.kind === 'plaque') amt = S === 0 ? 0.5 * smooth(0, 0.3, 1.25 - d.order) : 0;
      else if (d.kind === 'supra') amt = S === 0 ? 1 : 0;
      else if (d.kind === 'sub') amt = S === 0 ? smooth(0, 0.25, 1.3 - d.order * 0.3) : 0;
      else if (d.kind === 'deep') amt = S === 0 ? smooth(0, 0.25, 1.3 - d.order * 0.3) : 0;
      else amt = S === 0 ? 1 : S === 1 ? 1 - smooth(d.u - 0.02, d.u + 0.04, planeU) : 0;
      if (S === 0 && d.kind !== 'rough') amt *= 1 - smooth(d.u - 0.02, d.u + 0.04, scaleU);
      const sc = Math.max(1e-4, d.s * amt);
      const u = halfW(d.y, d.side) + (d.kind === 'plaque' ? 0.015 : 0.01);
      depDummy.position.set(d.side * u, d.y, d.z);
      depDummy.rotation.set(0, 0, d.spin);
      depDummy.scale.set(sc * (d.kind === 'plaque' ? 0.5 : 0.8), sc, sc);
      depDummy.updateMatrix();
      depositMesh.setMatrixAt(i, depDummy.matrix);
    });
    depositMesh.instanceMatrix.needsUpdate = true;

    // probe re-measures the pocket once the gums have healed
    const pr = ease(approach('probe', S === 2 && p > 0.66));
    const depthT = smooth(0.74, 0.84, p);
    const yTip = lerp(P.edge + 0.9, P.attach + 0.02, depthT);
    const yy = Math.min(yTip, P.edge);
    probe.position.set(halfW(yy, 1) + gapAt(P, yy) * 0.5, yTip + lerp(4, 0, pr), 0.08);
    probe.rotation.z = -0.08;
    probe.visible = pr > 0.01;
    setLabel(probeLabel, 'Shallower: about 3 mm');
    probeLabel.position.set(2.4, 0.25, 0.6);
    probeLabel.material.opacity = pr * smooth(0.85, 1, depthT);

    // ultrasonic scaler with water spray
    const scn = ease(approach('scaler', S === 0 && p > 0.03 && p < 0.95));
    pocketTip(scaleU, P, 7, perioTip);
    perioTip.x += (Math.random() - 0.5) * 0.012;
    aimTool(scaler, perioTip, Math.min(1, dt * 5));
    scaler.position.copy(perioTip).addScaledVector(wtmp.set(0, 1, 0).applyQuaternion(scaler.quaternion), lerp(5, 0, scn));
    scaler.visible = scn > 0.01;
    if (S === 0 && scn > 0.9 && p > 0.08 && p < 0.92) emitDust(PERIO.localToWorld(perioWorld.copy(perioTip)), 3, 1.2);

    // curette smooths the root surfaces
    const cu = ease(approach('curette', S === 1 && p > 0.03 && p < 0.95));
    pocketTip(planeU, P, 5, perioTip);
    aimTool(curette, perioTip, Math.min(1, dt * 5));
    curette.position.copy(perioTip).addScaledVector(wtmp.set(0, 1, 0).applyQuaternion(curette.quaternion), lerp(5, 0, cu));
    curette.visible = cu > 0.01;
  }
  dust.material.color.setHex(curLoc === 'perio' ? 0xd6f1ff : 0xf5ecd9);

  // ---- periodontal disease (same cross-section, telling the story of the disease)
  const perioStep = topic && topic.id === 'cleaning' ? ['pd_healthy', 'pd_gingivitis', 'pd_early', 'pd_advanced'].indexOf(id) : -1;
  if (perioStep >= 0) {
    const S = perioStep;   // what gum disease does, shown before the cleaning that treats it
    const P = [
      P_HEALTHY,
      lerpP(P_HEALTHY, P_GINGIVITIS, smooth(0.1, 0.6, p)),
      lerpP(P_GINGIVITIS, P_EARLY, smooth(0.1, 0.65, p)),
      lerpP(P_EARLY, P_ADVANCED, smooth(0.1, 0.7, p)),
    ][S];
    rebuildPerio(P);
    const inflam = [0, smooth(0.1, 0.6, p), 1, 1][S];
    perioGumMat.color.setHex(0xe48a98).lerp(tmp.setHex(0xc2303e), inflam);

    // plaque, then tartar above and below the gumline, deeper as the disease advances
    const plaqueAmt = S === 1 ? smooth(0.1, 0.5, p) : S >= 2 ? 0.5 : 0;
    const supraAmt = S === 1 ? smooth(0.55, 0.95, p) : S >= 2 ? 1 : 0;
    const subAmt = S === 2 ? smooth(0.2, 0.8, p) : S >= 3 ? 1 : 0;
    const deepAmt = S === 3 ? smooth(0.25, 0.85, p) : 0;
    const clean = 0;
    deposits.forEach((d, i) => {
      let amt = d.kind === 'plaque' ? plaqueAmt * smooth(0, 0.3, plaqueAmt * 2.5 - d.order)
        : d.kind === 'supra' ? supraAmt
        : d.kind === 'sub' ? subAmt * smooth(0, 0.25, subAmt * 1.3 - d.order * 0.3)
        : d.kind === 'deep' ? deepAmt * smooth(0, 0.25, deepAmt * 1.3 - d.order * 0.3)
        : S >= 2 ? 1 : 0;                                                 // roughened root surface
      amt *= 1 - smooth(d.u * 0.5, d.u * 0.5 + 0.25, clean);
      const sc = Math.max(1e-4, d.s * amt);
      const u = halfW(d.y, d.side) + (d.kind === 'plaque' ? 0.015 : 0.01);
      depDummy.position.set(d.side * u, d.y, d.z);
      depDummy.rotation.set(0, 0, d.spin);
      depDummy.scale.set(sc * (d.kind === 'plaque' ? 0.5 : 0.8), sc, sc);
      depDummy.updateMatrix();
      depositMesh.setMatrixAt(i, depDummy.matrix);
    });
    depositMesh.instanceMatrix.needsUpdate = true;

    // gums that bleed when brushed
    const bleed = S === 1 ? smooth(0.55, 0.8, p) : S >= 2 ? 0.5 : 0;
    bleedGlow.forEach((g, i) => {
      g.material.opacity = bleed * (0.35 + 0.35 * Math.sin(time * 2.5 + i * 2.1));
      g.position.set((i % 2 ? 1 : -1) * (halfW(P.edge, i % 2 ? 1 : -1) + 0.12), P.edge + 0.05 + 0.03 * i, 0.25);
    });

    // the probe shows how deep the pocket has become
    const pr = ease(approach('probe', (S === 0 && p > 0.45 && p < 0.95) || (S === 2 && p > 0.66)));
    const depthT = S === 0 ? smooth(0.55, 0.7, p) : smooth(0.74, 0.84, p);
    const yTip = lerp(P.edge + 0.9, P.attach + 0.02, depthT);
    const yy = Math.min(yTip, P.edge);
    probe.position.set(halfW(yy, 1) + gapAt(P, yy) * 0.5, yTip + lerp(4, 0, pr), 0.08);
    probe.rotation.z = -0.08;
    probe.visible = pr > 0.01;
    scaler.visible = curette.visible = false;

    if (S === 1) setLabel(probeLabel, 'Gingivitis — still reversible');
    else setLabel(probeLabel, S === 0 ? 'Healthy: 1–3 mm' : 'Deep pocket: 5+ mm');
    const showLabel = S === 1 && p > 0.5;
    probeLabel.position.set(S === 1 ? 1.75 : 2.3, S === 1 ? 0.45 : 0.25, 0.6);
    const want = showLabel ? 0.95 : (S === 0 || S === 2) ? pr * smooth(0.85, 1, depthT) : 0;
    probeLabel.material.opacity += (want - probeLabel.material.opacity) * Math.min(1, dt * 4);
  }

  // ---- dental implants
  if (topic && topic.id === 'implant') {

    nlFlow.visible = S === 0 || S === 4;

    nlRings.forEach((r, k) => {
      const ph = (time * 0.9 + k / 3) % 1;
      r.position.set(nlTip.x - 0.1, nlTip.y, 0.08);
      r.scale.setScalar(0.12 + ph * 0.9);
      r.material.opacity = snore * (1 - ph) * 0.75;
      r.visible = r.material.opacity > 0.01;
    });

    // the treatment areas light up one by one, the laser spot tracing each in turn
    const AW = 0.225, a0 = 0.07;
    const ai = S === 2 ? Math.floor((p - a0) / AW) : -1;
    nlAreas.forEach((A, i) => {
      const want = S !== 2 ? 0 : i === ai ? 1 : i < ai || p > a0 + 4 * AW ? 0.5 : 0;
      A.line.material.opacity += (want - A.line.material.opacity) * Math.min(1, dt * 5);
      A.line.visible = A.line.material.opacity > 0.01;
    });
    if (S === 2 && ai >= 0 && ai < 4) {
      const local = (p - a0 - ai * AW) / AW;
      nlSpot.position.copy(nlAreas[ai].line.userData.curve.getPointAt(0.5 - 0.5 * Math.cos(local * Math.PI * 2))).setZ(0.12);
      nlSpot.material.opacity = smooth(0, 0.08, local) * (1 - smooth(0.92, 1, local)) * (0.7 + 0.3 * Math.sin(time * 16));
      label = nlAreas[ai].name;
    } else nlSpot.material.opacity = 0;
    if (label) setLabel(nlLabel, label);
    nlLabel.material.opacity += ((label ? 0.95 : 0) - nlLabel.material.opacity) * Math.min(1, dt * 4);

    // how it works: two passes of the Fotona laser. Nd:YAG first, warming deep into the tissue; then Er:YAG,
    // working near the surface, where the collagen fibres tighten behind it
    if (S === 1) {
      const P1 = [0.14, 0.44], P2 = [0.54, 0.84];                         // the two passes, each left to right
      const u1 = smooth(P1[0], P1[1], p), u2 = smooth(P2[0], P2[1], p);
      const pass2 = p > (P1[1] + P2[0]) / 2;
      setNlFibres(lerp(-2.4, 2.4, u2));
      const inPlace = smooth(0.04, 0.12, p) * (1 - smooth(0.88, 0.98, p));
      const between = smooth(P1[1], P1[1] + 0.02, p) * (1 - smooth(P2[0] - 0.02, P2[0], p));   // lifted while it goes back to the start
      const lx = pass2 ? lerp(-1.9, 1.9, u2) : p > P1[1] ? lerp(1.9, -1.9, smooth(P1[1] + 0.02, P2[0] - 0.02, p)) : lerp(-1.9, 1.9, u1);
      nlLaser.position.set(lx, NL_BLOCK_TOP + 0.35 + lerp(3, 0, inPlace) + 0.9 * between, 0.2);
      const firing = inPlace * (1 - between) * (pass2 ? smooth(P2[0], P2[0] + 0.03, p) * (1 - smooth(P2[1], P2[1] + 0.03, p))
        : smooth(P1[0], P1[0] + 0.03, p) * (1 - smooth(P1[1], P1[1] + 0.03, p)));
      const beamCol = pass2 ? 0xffb040 : 0xff3355;                     // amber for Er:YAG, red for Nd:YAG
      nlBeam.material.color.setHex(beamCol); nlHowGlow.material.color.setHex(beamCol);
      nlBeam.position.set(nlLaser.position.x, NL_BLOCK_TOP + 0.18, 0.2);
      nlBeam.material.opacity = firing * (0.45 + 0.2 * Math.sin(time * 18));
      nlHowGlow.position.set(nlLaser.position.x, NL_BLOCK_TOP + 0.03, 0.3);
      nlHowGlow.material.opacity = firing * (0.7 + 0.3 * Math.sin(time * 14));
      const hu = nlHeat.material.uniforms;
      hu.deepX.value = lerp(-2.4, 2.4, u1); hu.deepAmt.value = smooth(P1[0], P1[0] + 0.04, p) * (1 - 0.55 * smooth(P2[0], 0.95, p));
      hu.surfX.value = lerp(-2.4, 2.4, u2); hu.surfAmt.value = smooth(P2[0], P2[0] + 0.04, p) * (1 - 0.6 * smooth(P2[1], 0.97, p));
      nlFibreMat.emissive.setHex(0x5a3a20).lerp(tmp.setHex(0xff7a3c), 0.35 * firing * (pass2 ? 1 : 0.4));
      const hl = p < P1[0] ? 'Loose collagen fibres' : p < P1[1] + 0.03 ? 'Nd:YAG: deep, gentle warming'
        : p < P2[0] ? 'Then the second wavelength' : p < P2[1] + 0.03 ? 'Er:YAG: the collagen tightens' : 'Tightened: firmer tissue';
      setLabel(nlHowLabel, hl);
      nlHowLabel.material.opacity += ((p > 0.04 ? 0.95 : 0) - nlHowLabel.material.opacity) * Math.min(1, dt * 4);
    }
    if (S === 3) drawNlPlan(smooth(0.1, 0.85, p));
  }

  // ---- camera, with a quick fade when moving between the mouth, the computer, and the mill
  const want = SHOTS[id] || IDLE;
  if (want.loc !== curLoc) {
    fade = Math.min(1, fade + dt * 3);
    if (fade >= 1) {
      curLoc = want.loc; shownShot = want;
      camera.position.set(...want.pos); camLook.set(...want.look);
    }
  } else {
    shownShot = want;
    fade = Math.max(0, fade - dt * 2.5);
  }
  $('fade').style.opacity = fade;
  const orbit = id === 'idle' ? time * 0.15 : id === 'result' ? time * 0.35 : shownShot.loc === 'mouth' ? Math.sin(time * 0.25) * 0.18 : Math.sin(time * 0.25) * 0.05;
  const pivot = shownShot.loc === 'desk' ? DESK : shownShot.loc === 'mill' ? MILL : null;
  camTarget.set(...shownShot.pos);
  if (pivot) camTarget.sub(pivot).applyAxisAngle(THREE.Object3D.DEFAULT_UP, orbit).add(pivot);
  else camTarget.applyAxisAngle(THREE.Object3D.DEFAULT_UP, orbit);
  lookTarget.set(...shownShot.look);
  const k = Math.min(1, dt * 1.6);
  camera.position.lerp(camTarget, k);
  camLook.lerp(lookTarget, k);
  camera.lookAt(camLook.x + (Math.random() - 0.5) * shake, camLook.y + (Math.random() - 0.5) * shake, camLook.z);

  desk.visible = curLoc === 'desk';   // keep the office sets out of the mouth shots
  mill.visible = curLoc === 'mill';
  world.visible = curLoc === 'mouth';
  PERIO.visible = curLoc === 'perio';
  IMPL.visible = curLoc === 'implant';
  ALIGN.visible = curLoc === 'align';
  NL_SECTION.visible = curLoc === 'nlsec';
  NL_HOW.visible = curLoc === 'nlhow';
  NL_PLAN.visible = curLoc === 'nlplan';
  renderer.render(scene, camera);
  $('status').style.display = 'none';
});
</script>
<script>
  window.addEventListener('error', e => { const s = document.getElementById('status'); s.style.display = 'flex'; s.textContent = '3D failed to load: ' + e.message; });
</script>
</body>
</html>
